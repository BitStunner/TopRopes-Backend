openapi: 3.0.3
info:
  title: TopRopes Backend API
  version: 0.2.0-draft
  x-summary: REST contract used by the TopRopes frontend.
  description: |
    This document is the REST contract for ring-rumble-react and the Spring implementation.

    Current UI identity model:
    - Users enter username + password only.
    - The backend issues JWT access and refresh tokens.

    Current UI authorization model:
    - Catalogue data is publicly readable.
    - User-owned ratings, dossiers, and promos require authentication.
    - Catalogue mutations require an administrator role.
  x-contract-status: implemented
  x-current-frontend-runtime: Spring Boot JWT API and PostgreSQL
servers:
  - url: https://api.topropes.example.com/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Catalog
  - name: Ratings
  - name: FeudDossiers
  - name: FeudPromos
  - name: Admin
  - name: Media
paths:
  /health:
    get:
      tags: [Health]
      summary: Service health probe
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      security: []
      operationId: register
      description: Creates an account using username and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /catalog/promotions:
    get:
      tags: [Catalog]
      summary: List promotions
      security: []
      operationId: listPromotions
      responses:
        '200':
          description: Promotions list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Promotion'

  /catalog/wrestlers:
    get:
      tags: [Catalog]
      summary: List wrestlers
      security: []
      operationId: listWrestlers
      parameters:
        - $ref: '#/components/parameters/PromotionFilter'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Wrestler search result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrestlerPage'

  /catalog/wrestlers/{slug}:
    get:
      tags: [Catalog]
      summary: Get wrestler by slug
      security: []
      operationId: getWrestlerBySlug
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: Wrestler detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wrestler'
        '404':
          $ref: '#/components/responses/NotFound'

  /catalog/events:
    get:
      tags: [Catalog]
      summary: List events
      security: []
      operationId: listEvents
      parameters:
        - $ref: '#/components/parameters/PromotionFilter'
        - $ref: '#/components/parameters/EventTypeFilter'
        - $ref: '#/components/parameters/YearFilter'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Events search result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'

  /catalog/events/{slug}:
    get:
      tags: [Catalog]
      summary: Get event by slug
      security: []
      operationId: getEventBySlug
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: Event detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFound'

  /catalog/matches:
    get:
      tags: [Catalog]
      summary: List matches
      security: []
      operationId: listMatches
      parameters:
        - $ref: '#/components/parameters/PromotionFilter'
        - $ref: '#/components/parameters/EventSlugFilter'
        - $ref: '#/components/parameters/FeudSlugFilter'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Matches search result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchPage'

  /catalog/matches/{slug}:
    get:
      tags: [Catalog]
      summary: Get match by slug
      security: []
      operationId: getMatchBySlug
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: Match detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '404':
          $ref: '#/components/responses/NotFound'

  /catalog/feuds:
    get:
      tags: [Catalog]
      summary: List feuds
      security: []
      operationId: listFeuds
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Feuds search result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeudPage'

  /catalog/feuds/{slug}:
    get:
      tags: [Catalog]
      summary: Get feud by slug
      security: []
      operationId: getFeudBySlug
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: Feud detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feud'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/ratings:
    get:
      tags: [Ratings]
      summary: List current user's ratings
      operationId: listMyRatings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Ratings page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchRatingPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/ratings/{matchSlug}:
    put:
      tags: [Ratings]
      summary: Create or update rating for a match
      operationId: upsertMyRating
      security:
        - bearerAuth: []
      parameters:
        - name: matchSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchRatingUpsertRequest'
      responses:
        '200':
          description: Rating persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchRating'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Ratings]
      summary: Delete rating for a match
      operationId: deleteMyRating
      security:
        - bearerAuth: []
      parameters:
        - name: matchSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Rating removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/feuds/{feudSlug}/dossier:
    get:
      tags: [FeudDossiers]
      summary: Get current user's dossier for a feud
      operationId: getMyFeudDossier
      security:
        - bearerAuth: []
      parameters:
        - name: feudSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dossier result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeudDossier'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [FeudDossiers]
      summary: Create or update current user's dossier for a feud
      operationId: upsertMyFeudDossier
      security:
        - bearerAuth: []
      parameters:
        - name: feudSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeudDossierUpsertRequest'
      responses:
        '200':
          description: Dossier persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeudDossier'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [FeudDossiers]
      summary: Delete current user's dossier for a feud
      operationId: deleteMyFeudDossier
      security:
        - bearerAuth: []
      parameters:
        - name: feudSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Dossier removed.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/feuds/{feudSlug}/promos:
    get:
      tags: [FeudPromos]
      summary: List current user's promos for a feud
      operationId: listMyFeudPromos
      security:
        - bearerAuth: []
      parameters:
        - name: feudSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Promos list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeudPromo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/feuds/{feudSlug}/promos/{promoSlug}:
    put:
      tags: [FeudPromos]
      summary: Create or update current user's feud promo
      operationId: upsertMyFeudPromo
      security:
        - bearerAuth: []
      parameters:
        - name: feudSlug
          in: path
          required: true
          schema:
            type: string
        - name: promoSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeudPromoUpsertRequest'
      responses:
        '200':
          description: Promo persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeudPromo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [FeudPromos]
      summary: Delete current user's feud promo
      operationId: deleteMyFeudPromo
      security:
        - bearerAuth: []
      parameters:
        - name: feudSlug
          in: path
          required: true
          schema:
            type: string
        - name: promoSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Promo removed.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/catalog/import:
    post:
      tags: [Admin]
      summary: Import or upsert catalog data
      operationId: importCatalog
      security:
        - bearerAuth: []
      description: Requires ROLE_ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogImportRequest'
      responses:
        '202':
          description: Import accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/catalog/events/{slug}:
    put:
      tags: [Admin]
      summary: Create or update an event
      operationId: upsertCatalogEvent
      security:
        - bearerAuth: []
      description: Requires ROLE_ADMIN.
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpsertRequest'
      responses:
        '200':
          description: Event persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Admin]
      summary: Delete an event
      operationId: deleteCatalogEvent
      security:
        - bearerAuth: []
      description: Planned parity operation. Current UI permits the record author or an admin.
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '204':
          description: Event removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/catalog/matches/{slug}:
    put:
      tags: [Admin]
      summary: Create or update a match
      operationId: upsertCatalogMatch
      security:
        - bearerAuth: []
      description: Requires ROLE_ADMIN.
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchUpsertRequest'
      responses:
        '200':
          description: Match persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Admin]
      summary: Delete a match
      operationId: deleteCatalogMatch
      security:
        - bearerAuth: []
      description: Planned parity operation. Current UI permits the record author or an admin.
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '204':
          description: Match removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/catalog/wrestlers:
    get:
      tags: [Admin]
      summary: List editorial wrestlers
      operationId: listCatalogWrestlers
      security:
        - bearerAuth: []
      description: Planned parity operation for the Data Desk list.
      responses:
        '200':
          description: Wrestlers ordered by creation time, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EditorialWrestler'
    post:
      tags: [Admin]
      summary: Create an editorial wrestler
      operationId: createCatalogWrestler
      security:
        - bearerAuth: []
      description: Planned parity operation. Current UI permits every authenticated user to create a record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrestlerUpsertRequest'
      responses:
        '201':
          description: Wrestler created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorialWrestler'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/catalog/wrestlers/{slug}:
    put:
      tags: [Admin]
      summary: Update an editorial wrestler
      operationId: upsertCatalogWrestler
      security:
        - bearerAuth: []
      description: Planned parity operation. Current UI permits the record author or an admin.
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrestlerUpsertRequest'
      responses:
        '200':
          description: Wrestler persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorialWrestler'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Admin]
      summary: Delete an editorial wrestler
      operationId: deleteCatalogWrestler
      security:
        - bearerAuth: []
      description: Planned parity operation. Current UI permits the record author or an admin.
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '204':
          description: Wrestler removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /media/wrestler-images:
    post:
      tags: [Media]
      summary: Upload a wrestler portrait
      operationId: uploadWrestlerImage
      security:
        - bearerAuth: []
      description: Backend-managed wrestler image upload. Accept PNG only, with a maximum object size of 2 MiB.
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/svg+xml:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Image stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrestlerImageUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Image exceeds the 2 MiB limit.
        '415':
          description: Unsupported image media type.

  /admin/catalog/feuds/{slug}:
    put:
      tags: [Admin]
      summary: Create or update a feud
      operationId: upsertCatalogFeud
      security:
        - bearerAuth: []
      description: Requires ROLE_ADMIN.
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeudUpsertRequest'
      responses:
        '200':
          description: Feud persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feud'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SlugPath:
      name: slug
      in: path
      required: true
      schema:
        type: string
    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PromotionFilter:
      name: promotion
      in: query
      required: false
      schema:
        type: string
        enum: [WWE, AEW, NJPW, Indie]
    EventTypeFilter:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum: [Weekly Show, PPV/PLE, Tournament, Special]
    YearFilter:
      name: year
      in: query
      required: false
      schema:
        type: integer
        minimum: 1900
        maximum: 9999
    EventSlugFilter:
      name: eventSlug
      in: query
      required: false
      schema:
        type: string
    FeudSlugFilter:
      name: feudSlug
      in: query
      required: false
      schema:
        type: string

  responses:
    Unauthorized:
      description: Authentication required or token invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but missing required role/permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Resource conflict, for example duplicate username.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request payload or query values failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
          pattern: '^[a-zA-Z0-9_.-]{3,24}$'
          example: ironfan_88
        password:
          type: string
          format: password
          minLength: 8
          example: ringRumble123

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: ironfan_88
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
